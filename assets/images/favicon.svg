<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1908" />
      <stop offset="100%" stop-color="#040c03" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8ff85" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield/Badge with Chamfered Tech Edge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#brand-grad)" stroke="#224416" stroke-width="2"/>
  
  <!-- Dynamic Growth Chart & Bullish Arrow -->
  <path d="M14 44 L24 34 L32 40 L46 20" fill="none" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Arrowhead for IPO Momentum -->
  <polygon points="48,18 48,27 40,20" fill="#c8ff85" />
  
  <!-- Modern Tech Cut Dots (Nodes) -->
  <circle cx="14" cy="44" r="3" fill="#a3e635" />
  <circle cx="24" cy="34" r="3" fill="#a3e635" />
  <circle cx="32" cy="40" r="3" fill="#a3e635" />
</svg>
